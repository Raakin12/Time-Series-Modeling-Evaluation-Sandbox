name: temp-bike-r1-features-only
on:
  push:
    paths:
      - ".github/workflows/temp-bike-r1-features-only.yml"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q pandas numpy scikit-learn catboost==1.2.8 pygam==0.11.0
      - name: Compare exact R1 features only
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          from sklearn.linear_model import LinearRegression
          from sklearn.metrics import mean_absolute_error
          from catboost import CatBoostRegressor
          from pygam import LinearGAM, s

          URL="https://raw.githubusercontent.com/ardasengun04/bike-sharing-data/main/hour.csv"
          df=pd.read_csv(URL)
          df["dteday"]=pd.to_datetime(df["dteday"])
          df["timestamp"]=df["dteday"]+pd.to_timedelta(df["hr"],unit="h")
          full_hours=pd.date_range(df["timestamp"].min(),df["timestamp"].max(),freq="h")
          cnt_hourly=df.set_index("timestamp")["cnt"].reindex(full_hours)
          df["history_end"]=df["dteday"]-pd.Timedelta(days=1)+pd.Timedelta(hours=17)

          weekly=[]
          for w in [1,2,3,4]:
              c=f"lag_{7*w}d"
              df[c]=(df["timestamp"]-pd.Timedelta(days=7*w)).map(cnt_hourly)
              weekly.append(c)
          df["same_hour_4w_median"]=df[weekly].median(axis=1)

          lag_hours=np.where(df["hr"]<=17,24,48)
          df["recent_known_same_hour"]=(
              df["timestamp"]-pd.to_timedelta(lag_hours,unit="h")
          ).map(cnt_hourly)

          r7=cnt_hourly.rolling(168,min_periods=1).sum()
          df["recent_7d_total"]=df["history_end"].map(r7)
          old=df["history_end"]-pd.Timedelta(days=28)
          df["prior_7d_total_4w_ago"]=old.map(r7)
          df["demand_level_ratio"]=(
              df["recent_7d_total"]/df["prior_7d_total_4w_ago"]
          ).clip(.6,1.4)

          df["scaled_weekly_median"]=(
              df["same_hour_4w_median"]*df["demand_level_ratio"].pow(.3)
          )
          df["R1"]=.90*df["scaled_weekly_median"]+.10*df["recent_known_same_hour"]

          FEATURES=["scaled_weekly_median","recent_known_same_hour"]

          folds={
            "fall":{"train_end":"2011-09-30","val_start":"2011-10-01","val_end":"2011-11-30"},
            "winter":{"train_end":"2011-12-31","val_start":"2012-01-01","val_end":"2012-02-29"},
            "spring":{"train_end":"2012-02-29","val_start":"2012-03-01","val_end":"2012-04-30"},
            "summer":{"train_end":"2012-05-31","val_start":"2012-06-01","val_end":"2012-07-31"},
          }
          cutoff=pd.Timestamp("2012-08-01")
          req=FEATURES+["cnt","R1","lag_7d"]
          dev=df[df["timestamp"]<cutoff].dropna(subset=req).copy()
          hold=df[df["timestamp"]>=cutoff].dropna(subset=req).copy()

          rows=[]
          oof=dev[["cnt"]].copy()
          names=["B0","R1","Linear","GAM","CatBoost"]
          for n in names:oof[n]=np.nan

          for fname,sp in folds.items():
              te=pd.Timestamp(sp["train_end"])+pd.Timedelta(hours=17)
              tr=dev[dev["timestamp"]<=te]
              va=dev[dev["dteday"].between(pd.Timestamp(sp["val_start"]),pd.Timestamp(sp["val_end"]))]

              preds={}
              preds["B0"]=va["lag_7d"].to_numpy()
              preds["R1"]=va["R1"].to_numpy()

              lr=LinearRegression().fit(tr[FEATURES],tr["cnt"])
              preds["Linear"]=lr.predict(va[FEATURES])

              gam=LinearGAM(s(0,n_splines=10)+s(1,n_splines=10)).fit(tr[FEATURES].to_numpy(),tr["cnt"].to_numpy())
              preds["GAM"]=gam.predict(va[FEATURES].to_numpy())

              cb=CatBoostRegressor(loss_function="MAE",iterations=500,depth=6,learning_rate=.05,random_seed=42,verbose=False,allow_writing_files=False)
              cb.fit(tr[FEATURES],tr["cnt"])
              preds["CatBoost"]=cb.predict(va[FEATURES])

              for n,p in preds.items():
                  oof.loc[va.index,n]=p
                  rows.append({"model":n,"fold":fname,"MAE":mean_absolute_error(va["cnt"],p),"n":len(va)})

          res=pd.DataFrame(rows)
          table=res.pivot(index="model",columns="fold",values="MAE")
          table["pooled"]=pd.Series({
              n:mean_absolute_error(oof.loc[oof[n].notna(),"cnt"],oof.loc[oof[n].notna(),n])
              for n in names
          })

          hp=hold.copy()
          hp["B0"]=hp["lag_7d"]; hp["R1"]=hp["R1"]
          lr=LinearRegression().fit(dev[FEATURES],dev["cnt"]); hp["Linear"]=lr.predict(hold[FEATURES])
          gam=LinearGAM(s(0,n_splines=10)+s(1,n_splines=10)).fit(dev[FEATURES].to_numpy(),dev["cnt"].to_numpy()); hp["GAM"]=gam.predict(hold[FEATURES].to_numpy())
          cb=CatBoostRegressor(loss_function="MAE",iterations=500,depth=6,learning_rate=.05,random_seed=42,verbose=False,allow_writing_files=False)
          cb.fit(dev[FEATURES],dev["cnt"]); hp["CatBoost"]=cb.predict(hold[FEATURES])
          table["holdout_aug_dec_2012"]=pd.Series({n:mean_absolute_error(hp["cnt"],hp[n]) for n in names})

          print("RESULTS_BEGIN")
          print(f"DEV_COMMON_ROWS={len(dev)} HOLDOUT_COMMON_ROWS={len(hold)}")
          print(table.reindex(names).round(4).to_csv())
          print("RESULTS_END")
          PY
