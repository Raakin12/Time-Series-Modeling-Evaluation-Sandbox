name: temp-bike-linear-comparison
on:
  push:
    paths:
      - ".github/workflows/temp-bike-linear-comparison.yml"

jobs:
  run-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas numpy scikit-learn
      - name: Run linear comparison
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from sklearn.linear_model import LinearRegression
          from sklearn.metrics import mean_absolute_error

          URL="https://raw.githubusercontent.com/ardasengun04/bike-sharing-data/main/hour.csv"
          df=pd.read_csv(URL)
          df["dteday"]=pd.to_datetime(df["dteday"])
          df["timestamp"]=df["dteday"]+pd.to_timedelta(df["hr"],unit="h")
          full_hours=pd.date_range(df["timestamp"].min(),df["timestamp"].max(),freq="h")
          cnt_hourly=df.set_index("timestamp")["cnt"].reindex(full_hours)
          df["history_end"]=df["dteday"]-pd.Timedelta(days=1)+pd.Timedelta(hours=17)

          weekly=[]
          for w in [1,2,3,4]:
              c=f"cnt_same_hour_{7*w}d_ago"
              df[c]=(df["timestamp"]-pd.Timedelta(days=7*w)).map(cnt_hourly)
              weekly.append(c)

          df["same_hour_4w_median"]=df[weekly].median(axis=1)
          lag_hours=np.where(df["hr"]<=17,24,48)
          df["recent_known_same_hour"]=(
              df["timestamp"]-pd.to_timedelta(lag_hours,unit="h")
          ).map(cnt_hourly)

          r7=cnt_hourly.rolling(168,min_periods=1).sum()
          n7=cnt_hourly.rolling(168,min_periods=1).count()
          df["recent_7d_total"]=df["history_end"].map(r7)
          df["recent_7d_n"]=df["history_end"].map(n7)
          old=df["history_end"]-pd.Timedelta(days=28)
          df["prior_7d_total_4w_ago"]=old.map(r7)
          df["prior_7d_n_4w_ago"]=old.map(n7)
          df["demand_level_ratio"]=(
              df["recent_7d_total"]/df["prior_7d_total_4w_ago"]
          ).clip(.6,1.4)

          df["scaled_weekly_median"]=(
              df["same_hour_4w_median"]*df["demand_level_ratio"].pow(.3)
          )
          df["R1"]=(
              .90*df["scaled_weekly_median"]+
              .10*df["recent_known_same_hour"]
          )

          HISTORY=weekly+[
              "same_hour_4w_median","recent_known_same_hour",
              "recent_7d_total","recent_7d_n",
              "prior_7d_total_4w_ago","prior_7d_n_4w_ago",
              "demand_level_ratio"
          ]
          R1_COMPONENTS=["scaled_weekly_median","recent_known_same_hour"]

          folds={
              "fall":{"train_end":"2011-09-30","val_start":"2011-10-01","val_end":"2011-11-30"},
              "winter":{"train_end":"2011-12-31","val_start":"2012-01-01","val_end":"2012-02-29"},
              "spring":{"train_end":"2012-02-29","val_start":"2012-03-01","val_end":"2012-04-30"},
              "summer":{"train_end":"2012-05-31","val_start":"2012-06-01","val_end":"2012-07-31"},
          }
          cutoff=pd.Timestamp("2012-08-01")
          dev=df[df["timestamp"]<cutoff].dropna(subset=HISTORY+R1_COMPONENTS+["cnt","R1"]).copy()
          hold=df[df["timestamp"]>=cutoff].dropna(subset=HISTORY+R1_COMPONENTS+["cnt","R1"]).copy()

          rows=[]
          oof=dev[["cnt"]].copy()
          for c in ["B0","R1","LR-R1","LR-H"]:
              oof[c]=np.nan

          fold_models={}
          for fold_name,sp in folds.items():
              te=pd.Timestamp(sp["train_end"])+pd.Timedelta(hours=17)
              tr=dev[dev["timestamp"]<=te].copy()
              va=dev[dev["dteday"].between(pd.Timestamp(sp["val_start"]),pd.Timestamp(sp["val_end"]))].copy()

              preds={
                  "B0":va["cnt_same_hour_7d_ago"].to_numpy(),
                  "R1":va["R1"].to_numpy()
              }

              lr_r1=LinearRegression().fit(tr[R1_COMPONENTS],tr["cnt"])
              preds["LR-R1"]=lr_r1.predict(va[R1_COMPONENTS])

              lr_h=LinearRegression().fit(tr[HISTORY],tr["cnt"])
              preds["LR-H"]=lr_h.predict(va[HISTORY])

              fold_models[fold_name]={
                  "LR-R1_intercept":float(lr_r1.intercept_),
                  "LR-R1_coef_scaled":float(lr_r1.coef_[0]),
                  "LR-R1_coef_recent":float(lr_r1.coef_[1])
              }

              for name,p in preds.items():
                  oof.loc[va.index,name]=p
                  rows.append({"model":name,"fold":fold_name,"MAE":mean_absolute_error(va["cnt"],p),"n":len(va)})

          res=pd.DataFrame(rows)
          table=res.pivot(index="model",columns="fold",values="MAE")
          table["pooled"]=pd.Series({
              c:mean_absolute_error(oof.loc[oof[c].notna(),"cnt"],oof.loc[oof[c].notna(),c])
              for c in ["B0","R1","LR-R1","LR-H"]
          })

          hp=hold.copy()
          hp["B0"]=hp["cnt_same_hour_7d_ago"]
          hp["R1"]=hp["R1"]
          lr_r1=LinearRegression().fit(dev[R1_COMPONENTS],dev["cnt"])
          hp["LR-R1"]=lr_r1.predict(hold[R1_COMPONENTS])
          lr_h=LinearRegression().fit(dev[HISTORY],dev["cnt"])
          hp["LR-H"]=lr_h.predict(hold[HISTORY])
          table["holdout_aug_dec_2012"]=pd.Series({
              c:mean_absolute_error(hp["cnt"],hp[c]) for c in ["B0","R1","LR-R1","LR-H"]
          })

          print("RESULTS_BEGIN")
          print(f"DEV_COMMON_ROWS={len(dev)} HOLDOUT_COMMON_ROWS={len(hold)}")
          print(table.reindex(["B0","R1","LR-R1","LR-H"]).round(4).to_csv())
          print("FOLD_LR_R1_COEFFICIENTS")
          for k,v in fold_models.items():
              print(k,v)
          print("FINAL_LR_R1",{
              "intercept":float(lr_r1.intercept_),
              "coef_scaled":float(lr_r1.coef_[0]),
              "coef_recent":float(lr_r1.coef_[1])
          })
          print("RESULTS_END")
          PY
